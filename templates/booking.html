<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book {{ category }} Ticket</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h1>Book Your {{ category }} Ticket</h1>

        {% if success %}
            <div class="success-card">
                <h2>🎉 Booking Confirmed!</h2>
                <p><strong>Passenger Name:</strong> {{ success.name }}</p>
                <p><strong>Transport Type:</strong> {{ success.category }}</p>
                <p><strong>Selected Route:</strong> {{ success.option }}</p>
                <p><strong>Travel Date:</strong> {{ success.date }}</p>
                <a href="/" class="btn-back">Book Another Ticket</a>
            </div>
        {% else %}
            <form method="POST">
                <label>Full Name:</label>
                <input type="text" name="passenger_name" placeholder="Enter Passenger Name" required>

                <label>Select {{ category }} Service:</label>
                <select name="selected_option" required>
                    {% for option in options %}
                        <option value="{{ option }}">{{ option }}</option>
                    {% endfor %}
                </select>

                <label>Date of Journey:</label>
                <input type="date" name="booking_date" required>

                <button type="submit">Confirm & Pay</button>
            </form>
            <br>
            <a href="/" class="btn-link">⬅ Back to Home</a>
        {% endif %}
    </div>

</body>
</html>
