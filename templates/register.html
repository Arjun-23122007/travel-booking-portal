<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Travel Booking Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <h2><i class="fa-solid fa-plane-departure"></i> Travel Portal</h2>
        <div>
            <a href="/"><i class="fa-solid fa-house"></i> Home</a>
            <a href="/login"><i class="fa-solid fa-right-to-bracket"></i> Login</a>
        </div>
    </nav>

    <div class="container" style="max-width: 450px; margin-top: 50px;">
        <h2><i class="fa-solid fa-user-plus"></i> Create Account</h2>
        <p style="text-align: center; color: #666; margin-bottom: 25px;">Sign up to book your tickets easily</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/register" method="POST">
            <div class="form-group">
                <label><i class="fa-solid fa-user"></i> Choose Username</label>
                <input type="text" name="username" placeholder="e.g. john_doe" required autocomplete="off">
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-envelope"></i> Email Address</label>
                <input type="email" name="email" placeholder="e.g. user@gmail.com" required autocomplete="off">
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-lock"></i> Create Password</label>
                <input type="password" name="password" placeholder="Create a strong password" required>
            </div>

            <button type="submit" class="btn" style="margin-top: 10px;">
                <i class="fa-solid fa-user-check"></i> Register Account
            </button>
        </form>

        <p style="text-align: center; margin-top: 25px; color: #555;">
            Already have an account? <a href="/login" style="color: #007bff; font-weight: bold; text-decoration: none;">Login Here</a>
        </p>
    </div>
</body>
</html>
